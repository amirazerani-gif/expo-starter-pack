openapi: 3.0.3
info:
  title: Starter API
  description: >
    Demo contract served by the local mock server (npm run mock).
    Replace it with your own backend's spec: set OPENAPI_URL in .env and run npm run gen:api.
  version: 1.0.0
servers:
  - url: http://localhost:4010
security:
  - bearerAuth: []

paths:
  /v1/auth/login:
    post:
      operationId: login
      tags: [Auth]
      summary: Sign in and receive a token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, password]
              properties:
                login: { type: string, minLength: 1 }
                password: { type: string, minLength: 1 }
                device_name: { type: string }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                type: object
                required: [message, data]
                properties:
                  message: { type: string }
                  data:
                    type: object
                    required: [token]
                    properties:
                      token: { type: string }
              example:
                message: Logged in.
                data:
                  token: demo-token-123
        "422":
          $ref: "#/components/responses/ValidationError"

  /v1/auth/logout:
    post:
      operationId: logout
      tags: [Auth]
      summary: Revoke the current token
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { type: string }
              example:
                message: Logged out.
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /v1/me:
    get:
      operationId: getMe
      tags: [User]
      summary: The signed-in user
      responses:
        "200":
          description: The user
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/User" }
              example:
                data:
                  id: 1
                  name: Demo User
                  email: demo@example.com
        "401":
          $ref: "#/components/responses/Unauthenticated"
    patch:
      operationId: updateMe
      tags: [User]
      summary: Update the signed-in user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                email: { type: string, format: email }
      responses:
        "200":
          description: The updated user
          content:
            application/json:
              schema:
                type: object
                required: [message, data]
                properties:
                  message: { type: string }
                  data: { $ref: "#/components/schemas/User" }
              example:
                message: Profile updated.
                data:
                  id: 1
                  name: Demo User
                  email: demo@example.com
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          $ref: "#/components/responses/ValidationError"

  /v1/items:
    get:
      operationId: listItems
      tags: [Items]
      summary: Paginated list (standard Laravel resource collection)
      parameters:
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200":
          description: A page of items
          content:
            application/json:
              schema:
                type: object
                required: [data, links, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Item" }
                  links: { $ref: "#/components/schemas/PaginationLinks" }
                  meta: { $ref: "#/components/schemas/PaginationMeta" }
              example:
                data:
                  - { id: 1, title: First item, description: Hello from the mock server }
                  - { id: 2, title: Second item, description: null }
                links: { first: "/v1/items?page=1", last: "/v1/items?page=1", prev: null, next: null }
                meta: { current_page: 1, from: 1, last_page: 1, per_page: 15, to: 2, total: 2 }
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      operationId: createItem
      tags: [Items]
      summary: Create an item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
                description: { type: string, nullable: true }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [message, data]
                properties:
                  message: { type: string }
                  data: { $ref: "#/components/schemas/Item" }
              example:
                message: Item created.
                data: { id: 3, title: New item, description: null }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          $ref: "#/components/responses/ValidationError"

  /v1/items/{item}:
    parameters:
      - { name: item, in: path, required: true, schema: { type: integer } }
    get:
      operationId: getItem
      tags: [Items]
      summary: One item
      responses:
        "200":
          description: The item
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Item" }
              example:
                data: { id: 1, title: First item, description: Hello from the mock server }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateItem
      tags: [Items]
      summary: Update an item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
                description: { type: string, nullable: true }
      responses:
        "200":
          description: The updated item
          content:
            application/json:
              schema:
                type: object
                required: [message, data]
                properties:
                  message: { type: string }
                  data: { $ref: "#/components/schemas/Item" }
              example:
                message: Item updated.
                data: { id: 1, title: First item, description: Hello from the mock server }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      operationId: deleteItem
      tags: [Items]
      summary: Delete an item
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { type: string }
              example:
                message: Item deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  responses:
    Unauthenticated:
      description: Missing or invalid token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
          example: { message: Unauthenticated. }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
          example: { message: Resource not found. }
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
          example:
            message: The given data was invalid.
            errors:
              login: [The login field is required.]
              password: [The password field is required.]
              title: [The title field is required.]

  schemas:
    User:
      type: object
      required: [id, name, email]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
    Item:
      type: object
      required: [id, title, description]
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string, nullable: true }
    ErrorBody:
      type: object
      required: [message]
      properties:
        message: { type: string }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
    PaginationLinks:
      type: object
      required: [first, last, prev, next]
      properties:
        first: { type: string, nullable: true }
        last: { type: string, nullable: true }
        prev: { type: string, nullable: true }
        next: { type: string, nullable: true }
    PaginationMeta:
      type: object
      required: [current_page, last_page, per_page, total]
      properties:
        current_page: { type: integer }
        from: { type: integer, nullable: true }
        last_page: { type: integer }
        per_page: { type: integer }
        to: { type: integer, nullable: true }
        total: { type: integer }